name: PureDarwin Weekly

on:
  schedule:
    # Runs every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: Reclaim space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
            android: true
            dotnet: true
            haskell: true
            large-packages: true
            swap-storage: true
            docker-images: true

      - name: Clone PureDarwin
        uses: actions/checkout@v4
        with:
          repository: 'PureDarwin/PureDarwin'
          ref: 'upstream-xnu-12377'

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build full image
        run: nix build .#image

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: puredarwin
          path: result/puredarwin.img
          if-no-files-found: error

  image-minimal:
    name: Build image-minimal
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: Reclaim space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
            android: true
            dotnet: true
            haskell: true
            large-packages: true
            swap-storage: true
            docker-images: true

      - name: Clone PureDarwin
        uses: actions/checkout@v4
        with:
          repository: 'PureDarwin/PureDarwin'
          ref: 'upstream-xnu-12377'

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build minimal image
        run: nix build .#image-minimal

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: puredarwin-minimal
          path: result/puredarwin-minimal.img
          if-no-files-found: error

  create-release:
    needs: [image-minimal, image]
    runs-on: ubuntu-latest
    steps:
      - name: Create release directory
        run: mkdir ./pdweekly ./pdweeklyzipped

      - name: Download minimal image
        uses: actions/download-artifact@v4
        with:
          name: puredarwin-minimal
          path: ./pdweekly

      - name: Download full image
        uses: actions/download-artifact@v4
        with:
          name: puredarwin
          path: ./pdweekly

      # puredarwin.img is too big
      - name: Compress images
        run: |
          zip -j ./pdweeklyzipped/puredarwin.zip ./pdweekly/puredarwin.img
          zip -j ./pdweeklyzipped/puredarwin-minimal.zip ./pdweekly/puredarwin-minimal.img
          # sanity check rq
          echo pdweekly:
          ls pdweekly/
          echo pdweeklyzipped:
          ls pdweeklyzipped/

      - name: Upload to Releases
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: pdweeklyzipped/*
          tag_name: weekly
          draft: false
          prerelease: true
